apply plugin: "com.android.application"

apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

react {
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    namespace = "pk.freebusinessik.app"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "pk.freebusinessik.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30
        versionName "1.7.3"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Revopush Staging — safe for internal/dev Release-like tests
            resValue "string", "CodePushDeploymentKey", "Of6KOCSdCIcqvc5U83NA5a1KZu3BVy6RKZ8QNx"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Revopush Production — Play Store / production APKs
            resValue "string", "CodePushDeploymentKey", "DkGQISjhDL-VTNpLubx1rFvGYnMDVy6RKZ8QNx"
        }
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }

    lint {
        abortOnError false
    }
    project.ext.react = [
    enableHermes: true,
    bundleInRelease: true,
    devDisabledInRelease: true,
    entryFile: "index.js",
    extraPackagerArgs: []
]
}

// Fail early if release keystore is missing when building bundleRelease
gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.name.contains('Release') && (it.name.contains('Bundle') || it.name.contains('Assemble')) }) {
        def releaseConfig = android.signingConfigs.release
        if (releaseConfig.storeFile == null || !releaseConfig.storeFile.exists()) {
            throw new RuntimeException(
                'Release keystore missing. Set MYAPP_UPLOAD_* in android/gradle.properties and place my-upload-key.keystore in android/app/.'
            )
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
    implementation("androidx.lifecycle:lifecycle-process:2.6.2")
    implementation("androidx.lifecycle:lifecycle-runtime:2.6.2")
    implementation("androidx.lifecycle:lifecycle-viewmodel:2.6.2")
    implementation("androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2")
    implementation project(':react-native-code-push')

    constraints {
        implementation("androidx.lifecycle:lifecycle-runtime") { version { strictly '2.6.2' } }
        implementation("androidx.lifecycle:lifecycle-viewmodel") { version { strictly '2.6.2' } }
        implementation("androidx.lifecycle:lifecycle-viewmodel-savedstate") { version { strictly '2.6.2' } }
        implementation("androidx.lifecycle:lifecycle-process") { version { strictly '2.6.2' } }
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// CodePush OTA (Microsoft client → Revopush server). RN 0.72 cannot use @revopush SDK 2.x.
apply from: "../../node_modules/react-native-code-push/android/codepush.gradle"
