apply plugin: "com.android.application"

apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

react {
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    autolinkLibrariesWithApp()
    
    // ✅ This is the correct React Native 0.78+ way to skip the crashing Metro task.
    // It tells Gradle to treat the release build like a debug variant for bundling,
    // forcing it to use the manually created index.android.bundle.
    debuggableVariants = ["debug", "release"]
}

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    namespace = "pk.freebusinessik.app"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "pk.freebusinessik.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 35
        versionName "1.7.3"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            resValue "string", "CodePushDeploymentKey", "Of6KOCSdCIcqvc5U83NA5a1KZu3BVy6RKZ8QNx"
        }
        release {
            signingConfig signingConfigs.release
            
            // Keep these false to prevent ProGuard from stripping native libraries and causing instant crashes
            minifyEnabled false
            shrinkResources false
            crunchPngs false 
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "CodePushDeploymentKey", "DkGQISjhDL-VTNpLubx1rFvGYnMDVy6RKZ8QNx"
        }
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        
        // Required for 16 KB page size support
        jniLibs {
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError false
    }
}

// Fail early if release keystore is missing when building bundleRelease
gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.name.contains('Release') && (it.name.contains('Bundle') || it.name.contains('Assemble')) }) {
        def releaseConfig = android.signingConfigs.release
        if (releaseConfig.storeFile == null || !releaseConfig.storeFile.exists()) {
            throw new RuntimeException(
                'Release keystore missing. Set MYAPP_UPLOAD_* in android/gradle.properties and place my-upload-key.keystore in android/app/.'
            )
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
    implementation("androidx.lifecycle:lifecycle-process:2.6.2")
    implementation("androidx.lifecycle:lifecycle-runtime:2.6.2")
    implementation("androidx.lifecycle:lifecycle-viewmodel:2.6.2")
    implementation("androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2")
    implementation project(':react-native-code-push')

    constraints {
        implementation("androidx.lifecycle:lifecycle-runtime") { version { strictly '2.6.2' } }
        implementation("androidx.lifecycle:lifecycle-viewmodel") { version { strictly '2.6.2' } }
        implementation("androidx.lifecycle:lifecycle-viewmodel-savedstate") { version { strictly '2.6.2' } }
        implementation("androidx.lifecycle:lifecycle-process") { version { strictly '2.6.2' } }
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// CodePush OTA (Microsoft client → Revopush server)
apply from: "../../node_modules/react-native-code-push/android/codepush.gradle"