buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 36
        ndkVersion = "23.1.7779620"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.0")
    }
}

// Stream Video / NetInfo can pull lifecycle 2.10 (KMP) — incompatible with RN 0.72
def lifecycleVersion = '2.6.2'
def pinAndroidxLifecycle = { resolutionStrategy ->
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.lifecycle') {
            details.useVersion lifecycleVersion
            details.because 'Pin lifecycle for RN 0.72 (avoid KMP 2.10 variant ambiguity)'
        }
    }
    resolutionStrategy.force(
        "androidx.lifecycle:lifecycle-runtime:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-runtime-ktx:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-viewmodel:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-viewmodel-ktx:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-viewmodel-savedstate:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-livedata-core:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-livedata:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-common:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-common-java8:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-process:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-service:${lifecycleVersion}",
    )
}

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url 'https://www.jitpack.io' }
    }
    configurations.configureEach { pinAndroidxLifecycle(resolutionStrategy) }
}

subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.plugins.hasPlugin('com.android.library') ||
                subproject.plugins.hasPlugin('com.android.application')) {
            subproject.android {
                compileSdkVersion rootProject.ext.compileSdkVersion
                buildToolsVersion rootProject.ext.buildToolsVersion
                if (defaultConfig != null && defaultConfig.minSdk != null) {
                    defaultConfig.minSdk rootProject.ext.minSdkVersion
                }
                buildFeatures {
                    buildConfig true
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                if (namespace == null) {
                    def manifestFile = file("${subproject.projectDir}/src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifestXml = new groovy.xml.XmlParser().parse(manifestFile)
                        def pkg = manifestXml.attribute('package')
                        if (pkg) {
                            namespace pkg
                        } else {
                            namespace "com.subproject.${subproject.name.replaceAll(/[^a-zA-Z0-9_]/, '_')}"
                        }
                    } else {
                        namespace "com.subproject.${subproject.name.replaceAll(/[^a-zA-Z0-9_]/, '_')}"
                    }
                }
            }
        }
        subproject.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
            sourceCompatibility = '17'
            targetCompatibility = '17'
        }
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = '17'
            }
        }
    }
}
