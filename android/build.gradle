import groovy.xml.XmlParser
buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.8.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.0")
    }
}

// Stream Video / NetInfo can pull lifecycle 2.10 (KMP) — incompatible with this RN Android toolchain
def lifecycleVersion = '2.6.2'
def pinAndroidxLifecycle = { resolutionStrategy ->
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.lifecycle') {
            details.useVersion lifecycleVersion
            details.because 'Pin lifecycle for RN 0.72 (avoid KMP 2.10 variant ambiguity)'
        }
    }
    resolutionStrategy.force(
        "androidx.lifecycle:lifecycle-runtime:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-runtime-ktx:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-viewmodel:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-viewmodel-ktx:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-viewmodel-savedstate:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-livedata-core:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-livedata:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-common:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-common-java8:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-process:${lifecycleVersion}",
        "androidx.lifecycle:lifecycle-service:${lifecycleVersion}",
    )
}

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url 'https://www.jitpack.io' }
    }
    configurations.configureEach {
        pinAndroidxLifecycle(resolutionStrategy)
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'io.github.crow-misia.libyuv' && details.requested.name == 'libyuv-android') {
                details.useVersion '0.37.0'
                details.because '16 KB page-size support for Android 15+'
            }
        }
    }
}

subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.plugins.hasPlugin('com.android.library') ||
                subproject.plugins.hasPlugin('com.android.application')) {
            subproject.android {
                compileSdkVersion rootProject.ext.compileSdkVersion
                buildToolsVersion rootProject.ext.buildToolsVersion
                if (defaultConfig != null && defaultConfig.minSdk != null) {
                    defaultConfig.minSdk rootProject.ext.minSdkVersion
                }
                buildFeatures {
                    buildConfig true
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                if (namespace == null) {
                    def manifestFile = file("${subproject.projectDir}/src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifestXml = new groovy.xml.XmlParser().parse(manifestFile)
                        def pkg = manifestXml.attribute('package')
                        if (pkg) {
                            namespace pkg
                        } else {
                            namespace "com.subproject.${subproject.name.replaceAll(/[^a-zA-Z0-9_]/, '_')}"
                        }
                    } else {
                        namespace "com.subproject.${subproject.name.replaceAll(/[^a-zA-Z0-9_]/, '_')}"
                    }
                }
            }
        }
        subproject.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
            sourceCompatibility = '17'
            targetCompatibility = '17'
        }
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        // Play Console: native .so files must be 16 KB page-size aligned (NDK 27 flag).
        def cmakeLists = file("${subproject.projectDir}/CMakeLists.txt")
        if (cmakeLists.exists() &&
                (subproject.plugins.hasPlugin('com.android.library') ||
                        subproject.plugins.hasPlugin('com.android.application'))) {
            subproject.android {
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            // ✅ FIXED: Removed the invalid -DCMAKE_OBJECT_PATH_MAX=50 flag
                            arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                                    "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
                        }
                    }
                }
            }
        }
    }
}